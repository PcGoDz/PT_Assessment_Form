<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCD Trend — PT Assessment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .tr-shell { min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }

    /* ── Neutral M3 context bar (no accent — BACKLOG: standalone pages stay neutral) ── */
    .tr-ctx-bar {
      height:56px; background:var(--m3-surface-container, var(--surface));
      border-bottom:1px solid var(--border); display:flex; align-items:center;
      padding:0 16px; gap:12px; flex-shrink:0; position:sticky; top:0; z-index:100;
    }
    .tr-ctx-back {
      font-size:18px; color:var(--text-muted); text-decoration:none; display:flex;
      align-items:center; justify-content:center; width:36px; height:36px;
      border-radius:var(--radius); transition:background .12s;
    }
    .tr-ctx-back:hover { background:var(--surface2); }
    .tr-ctx-title { font-size:15px; font-weight:600; color:var(--text); }
    .tr-ctx-spacer { flex:1; }

    .tr-main { padding:24px; max-width:1000px; margin:0 auto; width:100%; }
    .tr-heading { font-size:18px; font-weight:600; color:var(--text); margin:0 0 4px; }
    .tr-sub { font-size:12px; color:var(--text-muted); margin:0 0 20px; }

    /* ── Trend cards (form-local, M3 surface tokens) ── */
    .tr-card-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
      gap:16px; margin-bottom:24px;
    }
    .tr-card {
      background:var(--m3-surface-container, var(--surface));
      border:1px solid var(--border); border-radius:var(--radius);
      padding:14px 16px; box-shadow:var(--m3-elev-1, none);
      display:flex; flex-direction:column; gap:4px;
    }
    .tr-card-label {
      font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
      color:var(--text-muted); font-family:'IBM Plex Mono', monospace;
    }
    .tr-card-value { font-size:26px; font-weight:600; color:var(--text); line-height:1.1; }
    .tr-delta { font-size:12px; color:var(--text-muted); margin-bottom:2px; }
    .tr-card-chart { margin-top:2px; }

    /* ── Under-tracked metrics: quiet chip row ── */
    .tr-chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
    .tr-chip {
      font-size:12px; color:var(--text-muted); background:var(--surface2);
      border:1px solid var(--border); border-radius:999px; padding:4px 12px;
    }

    /* ── Visit history (semantic table) ── */
    .tr-hist-wrap { overflow-x:auto; }
    .tr-hist { width:100%; border-collapse:collapse; font-size:13px; }
    .tr-hist .tr-hist-cap {
      text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
      color:var(--text-muted); font-family:'IBM Plex Mono', monospace; padding:0 0 8px;
    }
    .tr-hist th, .tr-hist td {
      padding:8px 12px; border-bottom:1px solid var(--border); text-align:center; white-space:nowrap;
    }
    .tr-hist thead th {
      background:var(--surface2); color:var(--text-muted); font-weight:600; font-size:11px;
      text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Mono', monospace;
    }
    .tr-hist th[scope="row"] { text-align:left; font-weight:500; color:var(--text); }
    .tr-miss { color:var(--text-faint); }

    /* ── Empty / single-visit states ── */
    .tr-empty, .tr-note {
      padding:20px; color:var(--text-muted); font-size:13px; background:var(--surface);
      border:1px solid var(--border); border-radius:var(--radius);
    }
    .tr-note { margin-bottom:16px; }
  </style>
</head>
<body>
<div class="tr-shell">

  <!-- ── Neutral context bar ── -->
  <header class="tr-ctx-bar">
    <a href="/episode/{{ episode_id }}" class="tr-ctx-back" title="Back to Episode">&#8592;</a>
    <div class="tr-ctx-title">&#128200; NCD Trend</div>
    <div class="tr-ctx-spacer"></div>
    <a href="/episode/{{ episode_id }}" class="tr-ctx-back" title="Back to Episode"
       style="width:auto;padding:0 12px;font-size:13px;">Back to Episode</a>
  </header>

  <main class="tr-main">
    <h1 class="tr-heading">Per-Visit Measurement Trend</h1>
    <p class="tr-sub">Headline metrics across visits. Screen-only — never exported to PDF or MPIS.</p>
    <div id="trend-root"></div>
  </main>

</div>

<script>
  var EPISODE_ID = {{ episode_id }};
  // Persist dark mode chosen elsewhere in the app.
  if (localStorage.getItem('pt_dark') === '1') document.body.classList.add('dark');
</script>
<script src="/static/js/ncd_trend.js"></script>
</body>
</html>
