{% extends "base.html" %}

{% block form_name %}NCD / Obesity Assessment{% endblock %}

{% block sidebar_nav %}
<div class="nav-item" onclick="Main.go('s-patient')"><span class="nav-icon">&#128100;</span> Patient Info</div>
<div class="nav-item" onclick="Main.go('s-subjective')"><span class="nav-icon">&#128172;</span> Subjective</div>
{% endblock %}

{% block content %}
<style>
  /* NCD form-local CSS — scoped, additive, does not touch shared style.css */
  .irr-chip.sel-Single, .irr-chip.sel-Married, .irr-chip.sel-Widowed, .irr-chip.sel-Divorced,
  .irr-chip.sel-Yes, .irr-chip.sel-No {
    background: var(--accent-light); border-color: var(--accent);
    color: var(--accent); font-weight: 500;
  }
</style>
<div class="card" id="s-patient">
  <div class="card-header">
    <span class="sec-num">01</span>
    <h2>Patient Information</h2>
  </div>
  <div class="card-body">
    <div class="fg">
      <div class="field">
        <label>Patient Type</label>
        <div class="radio-group">
          <label><input type="radio" name="pt-type" value="local" onchange="FormBase.onPtTypeChange()"> Malaysian (NRIC)</label>
          <label><input type="radio" name="pt-type" value="foreign" onchange="FormBase.onPtTypeChange()"> Foreign (Passport)</label>
        </div>
      </div>
      <div class="fg c2">
        <div class="field" style="grid-column:span 2">
          <label>Full Name <span class="req">*</span></label>
          <input type="text" id="pt-name" placeholder="Patient full name">
        </div>
        <div class="field" id="nric-field">
          <label>NRIC No. <span class="req">*</span></label>
          <input type="text" id="pt-nric" placeholder="e.g. 661010071234" maxlength="12" oninput="FormBase.onNricInput(this.value)">
          <div class="derived-info">
            <span class="derived-badge hidden" id="derived-dob"></span>
            <span class="derived-badge hidden" id="derived-gender"></span>
          </div>
        </div>
        <div class="field" id="passport-field" style="display:none">
          <label>Passport No. <span class="req">*</span></label>
          <input type="text" id="pt-passport" placeholder="Passport number">
        </div>
        <div class="field" id="country-field" style="display:none">
          <label>Country of Origin</label>
          <select id="pt-country">
            <option value="">— Select —</option>
            <option value="No Information">No Information</option>
            <option value="Stateless">Stateless</option>
            <optgroup label="ASEAN">
              <option>Indonesia</option>
              <option>Myanmar</option>
              <option>Philippines</option>
              <option>Thailand</option>
              <option>Vietnam</option>
              <option>Cambodia</option>
              <option>Laos</option>
              <option>Brunei</option>
              <option>Singapore</option>
              <option>Timor-Leste</option>
            </optgroup>
            <optgroup label="South Asia">
              <option>Bangladesh</option>
              <option>India</option>
              <option>Pakistan</option>
              <option>Nepal</option>
              <option>Sri Lanka</option>
              <option>Afghanistan</option>
            </optgroup>
            <optgroup label="East Asia">
              <option>China</option>
              <option>Taiwan</option>
              <option>Japan</option>
              <option>South Korea</option>
              <option>Hong Kong</option>
            </optgroup>
            <optgroup label="Middle East">
              <option>Saudi Arabia</option>
              <option>Yemen</option>
              <option>Iraq</option>
              <option>Iran</option>
              <option>Jordan</option>
              <option>Syria</option>
            </optgroup>
            <optgroup label="Africa">
              <option>Nigeria</option>
              <option>Somalia</option>
              <option>Ghana</option>
              <option>Ethiopia</option>
              <option>Kenya</option>
              <option>Tanzania</option>
            </optgroup>
            <optgroup label="Other">
              <option>Australia</option>
              <option>United Kingdom</option>
              <option>United States</option>
              <option>France</option>
              <option>Germany</option>
              <option>Netherlands</option>
              <option>Other (not listed)</option>
            </optgroup>
          </select>
        </div>
        <div class="field">
          <label>Assessment Date <span class="req">*</span></label>
          <input type="date" id="pt-date">
        </div>
        <div class="field">
          <label>Date of Birth</label>
          <input type="date" id="pt-dob" onchange="FormBase.onDobChange(this.value)">
        </div>
        <div class="field">
          <label>Age</label>
          <input type="number" id="pt-age" placeholder="Years" min="0" max="130">
        </div>
        <div class="field" id="sex-field" style="display:none">
          <label>Sex <span class="req">*</span></label>
          <div class="radio-group">
            <label><input type="radio" name="pt-sex" value="M"> Male</label>
            <label><input type="radio" name="pt-sex" value="F"> Female</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card" id="s-subjective">
  <div class="card-header"><span class="sec-num">02</span><h2>Subjective</h2></div>
  <div class="card-body">
    <!-- Doctor's Diagnosis (REQUIRED) -->
    <div class="fg">
      <div class="field">
        <label>Doctor's Diagnosis <span class="req">*</span></label>
        <textarea id="diagnosis" rows="2" placeholder="As per referral"></textarea>
      </div>
    </div>
    <!-- Patient's Complaint -->
    <div class="fg">
      <div class="field">
        <label>Patient's Complaint</label>
        <textarea id="complaint" rows="2"></textarea>
      </div>
    </div>
    <!-- Special Questions -->
    <div class="fg c2">
      <div class="field">
        <label>Marital Status</label>
        <div class="irr-chips">
          <button type="button" class="irr-chip" id="marital-Single"   onclick="Form.pickMarital('Single')">Single</button>
          <button type="button" class="irr-chip" id="marital-Married"  onclick="Form.pickMarital('Married')">Married</button>
          <button type="button" class="irr-chip" id="marital-Widowed"  onclick="Form.pickMarital('Widowed')">Widowed</button>
          <button type="button" class="irr-chip" id="marital-Divorced" onclick="Form.pickMarital('Divorced')">Divorced</button>
        </div>
      </div>
      <div class="field">
        <label>Occupation</label>
        <input type="text" id="occupation">
      </div>
      <div class="field">
        <label>Recreation</label>
        <input type="text" id="recreation">
      </div>
      <div class="field">
        <label>PMHX</label>
        <input type="text" id="pmhx">
      </div>
      <div class="field">
        <label>Family History</label>
        <input type="text" id="family-hx">
      </div>
      <div class="field">
        <label>Medication</label>
        <input type="text" id="medication">
      </div>
    </div>
    <!-- Lifestyle -->
    <div class="fg c2">
      <div class="field">
        <label>Smoking</label>
        <div class="irr-chips">
          <button type="button" class="irr-chip" id="life-smoking-Yes" onclick="Form.pickLife('smoking','Yes')">Yes</button>
          <button type="button" class="irr-chip" id="life-smoking-No"  onclick="Form.pickLife('smoking','No')">No</button>
        </div>
        <input type="text" id="smoking-comment" placeholder="Comment" style="margin-top:6px">
      </div>
      <div class="field">
        <label>Alcohol</label>
        <div class="irr-chips">
          <button type="button" class="irr-chip" id="life-alcohol-Yes" onclick="Form.pickLife('alcohol','Yes')">Yes</button>
          <button type="button" class="irr-chip" id="life-alcohol-No"  onclick="Form.pickLife('alcohol','No')">No</button>
        </div>
        <input type="text" id="alcohol-comment" placeholder="Comment" style="margin-top:6px">
      </div>
      <div class="field">
        <label>Physically Active</label>
        <div class="irr-chips">
          <button type="button" class="irr-chip" id="life-active-Yes" onclick="Form.pickLife('active','Yes')">Yes</button>
          <button type="button" class="irr-chip" id="life-active-No"  onclick="Form.pickLife('active','No')">No</button>
        </div>
        <input type="text" id="active-comment" placeholder="Comment" style="margin-top:6px">
      </div>
    </div>
    <!-- Histories -->
    <div class="fg c2">
      <div class="field">
        <label>Current History</label>
        <textarea id="current-history" rows="3"></textarea>
      </div>
      <div class="field">
        <label>Past History</label>
        <textarea id="past-history" rows="3"></textarea>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/form_ncd.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  // NCD form init — clinical section handlers added in later tasks
});
</script>
{% endblock %}
